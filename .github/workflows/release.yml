name: release

# 触发：push 到 main
# 职责：bump 版本号 → Android 构建 → 创建 published GitHub Release
# APK 已用正式 keystore 签名（4 个 secrets：ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS / _KEY_PASSWORD），覆盖安装升级正常。

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false  # 已在跑的 release 不要被新 push 取消

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write  # 让 bump commit 能 push + 创建 Release
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # 调用已有的 bump 脚本，把新版本号写到 $GITHUB_OUTPUT 让后续 step 引用
      - name: Bump version
        id: bump
        run: |
          node tools/bump-version.js >> "$GITHUB_OUTPUT"
          echo "--- bumped ---"
          cat "$GITHUB_OUTPUT"

      # 把改了 app.json 的 commit 带 [skip ci] 推回 main，避免下次 push 又触发 release
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --staged --quiet; then
            echo "No version bump needed"
            exit 0
          fi
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      # Android 构建链：JDK 17 + Android SDK + Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Expo SDK 57 / RN 0.86 锁定的版本：API 36 + build-tools 36.0.0 + NDK 27.1.12297006
          # 用 packages 显式列，不用 sdk-version（v4 不再自动装 deprecated 'tools' 包）
          cmdline-tools-version: '11076708'
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      # Expo prebuild：CNG 模式下每次重新生成 android/ 目录
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      # 配正式签名：从 4 个 secrets 注入环境变量，调用 tools/android-signing.js
      # 写入 android/app/release.keystore + key.properties，并改 build.gradle 让 release 用 release 签名
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/android-signing.js

      # 缓存 Gradle 加速（best-effort）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 构建 release APK（已用正式 keystore 签名）
      - name: Build Android release APK
        run: cd android && ./gradlew :app:assembleRelease

      # 把 APK 当作 Release 的 asset
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.bump.outputs.version }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 创建 published GitHub Release，附 .apk 作为 asset
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
